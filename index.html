<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00347f">
  <meta name="description" content="Mobile-first PFA center visit interview checklist and meeting summary tool.">
  <meta name="robots" content="noindex,nofollow">
  <title>PFA Center Visit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/insight-lifetech-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/insight-lifetech-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="appShell">
    <header class="app-header">
      <div class="brand-block">
        <img src="assets/insight-lifetech-logo.png" alt="Insight Lifetech" class="brand-logo">
        <div>
          <p class="eyebrow">INSIGHT LIFETECH · EP MARKET INTELLIGENCE</p>
          <h1 id="appTitle">PFA中心拜访记录</h1>
          <p id="appSubtitle" class="subtitle"></p>
        </div>
      </div>
      <button id="languageToggle" class="language-toggle" type="button" aria-label="Switch language">EN</button>
    </header>

    <section class="record-toolbar" aria-label="Record management">
      <label class="record-picker">
        <span id="recordLabel"></span>
        <select id="recordSelect"></select>
      </label>
      <div class="toolbar-actions">
        <button id="newRecord" type="button" class="icon-button" title="New record">＋</button>
        <button id="duplicateRecord" type="button" class="icon-button" title="Duplicate record">⧉</button>
        <button id="deleteRecord" type="button" class="icon-button danger" title="Delete record">⌫</button>
      </div>
    </section>

    <section class="progress-area">
      <div class="progress-copy"><span id="completionLabel"></span><strong id="completionText">0%</strong></div>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <nav id="stepNav" class="step-nav" aria-label="Form sections"></nav>
    </section>

    <main id="formRoot" class="form-root" aria-live="polite"></main>

    <aside class="privacy-note">
      <span class="privacy-dot"></span>
      <span id="privacyText"></span>
    </aside>

    <footer class="bottom-bar">
      <button id="previousStep" class="button secondary" type="button"></button>
      <button id="nextStep" class="button primary" type="button"></button>
      <button id="pdfButton" class="button amber" type="button"></button>
      <button id="moreButton" class="button ghost compact" type="button" aria-expanded="false">•••</button>
      <div id="moreMenu" class="more-menu" hidden>
        <button id="exportJson" type="button"></button>
        <button id="importJson" type="button"></button>
      </div>
      <input id="jsonFile" type="file" accept="application/json,.json" hidden>
    </footer>
  </div>

  <section id="printReport" class="print-report" aria-hidden="true"></section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="translations.js"></script>
  <script src="app.js"></script>
</body>
</html>
